name: Release

# Started by publishing a GitHub release (web GUI) with a new tag vX.Y.Z.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-tag:
    # Fail fast, in parallel with the gates (R-DEPLOY-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

  gates:
    # Same gate set as on every push: tests + coverage, ruff, bandit, semgrep (R-DEPLOY-005)
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check-tag, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC), no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
