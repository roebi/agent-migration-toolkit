[project]
name = "agent-migration-toolkit"
version = "0.1.0"
description = "Shared hub toolkit for the agent-migration program: process tables, gap analysis, critical path timeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "roebi" }]
requires-python = ">=3.11"
keywords = ["agent-migration", "process-table", "gap-analysis", "critical-path", "toml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/roebi/agent-migration-toolkit"
Repository = "https://github.com/roebi/agent-migration-toolkit"
Changelog = "https://github.com/roebi/agent-migration-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/roebi/agent-migration-toolkit/issues"

[project.scripts]
gap-analysis-creator = "agent_migration_toolkit.cli:gap_main"
critical-path-timeline = "agent_migration_toolkit.cli:timeline_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.report]
fail_under = 80
show_missing = true
