[project]
name = "agent-migration-toolkit"
version = "0.1.0"
description = "Shared hub toolkit for the agent-migration program: process tables, gap analysis, critical path timeline"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "roebi" }]
requires-python = ">=3.11"
dependencies = [
    "tomli-w>=1.0",
]

[project.scripts]
gap-analysis-creator = "agent_migration_toolkit.cli:gap_main"
critical-path-timeline = "agent_migration_toolkit.cli:timeline_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
