# process-table.schema.yaml
# One entry per sub-process. This is the shared data contract that
# gap_analysis_creator.py and critical_path_timeline.py both read.
#
# Required fields per entry:
#   department:        string  - one of the 6 department names
#   process:            string  - the parent process name
#   sub_process:         string  - the specific sub-process being described
#   automation_grade:    enum    - full | partial | manual
#   output_artifact:      string  - what this sub-process produces
#   interface_type:       enum    - openapi | file | manual | none
#
# Optional fields:
#   input_artifact:       string  - what this sub-process consumes
#   notes:                string  - free text context from the collection meeting
#
# interface_type meaning:
#   openapi - already a clean machine contract, no gap
#   file    - artifact exists but is handed off as a file (csv, pdf, xlsx)
#   manual  - handoff is verbal, email, or copy-paste, no artifact contract yet
#   none    - no defined artifact at all yet
#
# Example entry:
- department: "Finance/Billing"
  process: "Invoice run"
  sub_process: "Match usage to contract"
  automation_grade: "manual"
  input_artifact: "usage log"
  output_artifact: "match report (spreadsheet)"
  interface_type: "manual"
  notes: "currently sent as an email attachment"
